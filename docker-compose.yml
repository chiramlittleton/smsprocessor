version: "3.8"

services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: smsuser
      POSTGRES_PASSWORD: smspassword
      POSTGRES_DB: smsprocessor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sms_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      DB_USER: smsuser
      DB_PASS: smspassword
      DB_NAME: smsprocessor
      DB_HOST: db
      DB_PORT: 5432
      PORT: 5050
      NODE_ENV: production  # ✅ Ensure dependencies install correctly
    ports:
      - "5050:5050"
    networks:
      - sms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - sms_network

volumes:
  pgdata:

networks:
  sms_network:
    driver: bridge
