name: Build, Test, and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend  # ✅ Adjusted path to backend
          file: ./backend/Dockerfile
          load: true
          tags: smsprocessor-backend:test

      - name: Run Backend Tests in Docker Container
        run: |
          docker run --rm smsprocessor-backend:test npx jest --coverage

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend  # ✅ Adjusted path to frontend
          file: ./frontend/Dockerfile
          load: true
          tags: smsprocessor-frontend:test

      - name: Push Backend Docker Image (Only if tests pass)
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smsprocessor-backend:latest

      - name: Push Frontend Docker Image (Only if tests pass)
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smsprocessor-frontend:latest
